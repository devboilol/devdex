plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// A monotonically increasing versionCode lets Android install a newer CI APK
// over the previous one without uninstalling. Set -PdevdexBuildNumber locally if needed.
def devdexBuildNumber = (project.findProperty("devdexBuildNumber")
    ?: System.getenv("GITHUB_RUN_NUMBER")
    ?: "0").toString().toInteger()
def devdexVersionCode = 3500 + devdexBuildNumber
// Keep the normal CI version by default, but allow an RC workflow to set an explicit label.
def devdexVersionName = (project.findProperty("devdexVersionName") ?: System.getenv("DEVDEX_VERSION_NAME") ?: "3.5.${devdexBuildNumber}").toString()

// CI can supply a private, stable signing key through GitHub Actions secrets.
// Never commit the keystore or its password to this public repository.
def devdexSigningStoreFile = System.getenv("DEVDEX_SIGNING_STORE_FILE")
def devdexSigningStorePassword = System.getenv("DEVDEX_SIGNING_STORE_PASSWORD")
def devdexSigningKeyAlias = System.getenv("DEVDEX_SIGNING_KEY_ALIAS")
def devdexSigningKeyPassword = System.getenv("DEVDEX_SIGNING_KEY_PASSWORD")
def devdexHasStableSigning = devdexSigningStoreFile != null &&
    !devdexSigningStoreFile.trim().isEmpty() &&
    file(devdexSigningStoreFile).exists() &&
    devdexSigningStorePassword != null && !devdexSigningStorePassword.isEmpty() &&
    devdexSigningKeyAlias != null && !devdexSigningKeyAlias.isEmpty() &&
    devdexSigningKeyPassword != null && !devdexSigningKeyPassword.isEmpty()

android {
    namespace "com.youki.dex"
    compileSdk 35

    defaultConfig {
        applicationId "com.youki.dex"
        minSdk 26
        targetSdk 35
        versionCode devdexVersionCode
        versionName devdexVersionName
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            // NOTE: "x86" (32-bit) intentionally omitted — matches minSdk 26
            // (Android 8.0+) targeting real devices; 32-bit x86 Android
            // devices are effectively nonexistent among app.build.gradle's
            // actual target audience (emulators use x86_64).
        }
    }

    signingConfigs {
        if (devdexHasStableSigning) {
            stable {
                storeFile file(devdexSigningStoreFile)
                storePassword devdexSigningStorePassword
                keyAlias devdexSigningKeyAlias
                keyPassword devdexSigningKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // With a configured private key, all CI debug APKs share one signing identity.
            if (devdexHasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (devdexHasStableSigning) signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/LICENSE.md'
            excludes += '/META-INF/LICENSE-notice.md'
            excludes += '/META-INF/DEPENDENCIES'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
            excludes += '/META-INF/logwirez_release.kotlin_module'
            excludes += '/META-INF/*.kotlin_module'
            pickFirst 'META-INF/LICENSE.md'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0-alpha10'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'

    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}
