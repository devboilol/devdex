name: Build DevDex Plus Launcher Base

on:
  push:
    branches:
      - 'devdex-plus/**'
    paths:
      - 'scripts/build-lawnchair-base-in-ci.sh'
      - 'scripts/verify-plus-manifest.py'
      - '.github/workflows/build-plus-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher-base:
    name: Build standalone Lawnchair baseline
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout DevDex integration branch
        uses: actions/checkout@v4
        with:
          path: devdex-src

      - name: Checkout pinned Lawnchair source
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 15ebe415830d8ac29a0b23659c8f6db10759d745
          path: lawnchair-src
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare launcher-only baseline
        run: bash "$GITHUB_WORKSPACE/devdex-src/scripts/build-lawnchair-base-in-ci.sh" "$GITHUB_WORKSPACE/lawnchair-src"

      - name: Build DevDex Plus launcher-base APK
        working-directory: lawnchair-src
        run: ./gradlew assembleLawnWithQuickstepGithubDebug -x licenseeAndroidLawnWithQuickstepGithubDebug -x copyLawnWithQuickstepGithubDebugLicenseeReportToAssets --stacktrace

      - name: Verify merged launcher manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find "$GITHUB_WORKSPACE/lawnchair-src/build/intermediates/merged_manifest" -path '*/lawnWithQuickstepGithubDebug/processLawnWithQuickstepGithubDebugMainManifest/AndroidManifest.xml' -print -quit)"
          test -n "$MANIFEST" || { echo "Merged manifest not found"; exit 1; }
          python3 "$GITHUB_WORKSPACE/devdex-src/scripts/verify-plus-manifest.py" "$MANIFEST"

      - name: Package launcher-base APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APK_CANDIDATES < <(find "$GITHUB_WORKSPACE/lawnchair-src/build/outputs/apk" -type f -name 'DevDexPlus-LauncherBase*.apk' -print | sort)
          if [[ "${#APK_CANDIDATES[@]}" -ne 1 ]]; then
            printf 'Expected exactly one launcher-base APK, found %s\n' "${#APK_CANDIDATES[@]}"
            printf '%s\n' "${APK_CANDIDATES[@]}"
            exit 1
          fi
          APK="${APK_CANDIDATES[0]}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/DevDexPlus-LauncherBase-alpha-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/DevDexPlus-LauncherBase-alpha-debug.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          echo "Built: $APK"

      - name: Upload launcher-base artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevDexPlus-launcher-base-alpha-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
