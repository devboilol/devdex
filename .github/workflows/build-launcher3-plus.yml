name: Build DevDex Plus Launcher3 Prototype

on:
  push:
    branches:
      - devdex-plus/launcher3-prototype
    paths:
      - 'scripts/build-launcher3-plus-in-ci.sh'
      - 'docs/LAUNCHER3_BASE_PROTOTYPE.md'
      - '.github/workflows/build-launcher3-plus.yml'
      - 'app/src/main/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher3-prototype:
    name: Launcher3 Android 16-S2 plus DevDex Engine
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout DevDex source
        uses: actions/checkout@v4
        with:
          path: devdex-src

      - name: Checkout pinned Launcher3 Android 16-S2 Gradle port
        uses: actions/checkout@v4
        with:
          repository: yuchuangu85/Launcher3
          ref: a000136df789859f893402ba0d7ebda86808305a
          path: launcher3-src
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integrate DevDex Engine and freeform launch path
        run: bash "$GITHUB_WORKSPACE/devdex-src/scripts/build-launcher3-plus-in-ci.sh" "$GITHUB_WORKSPACE/devdex-src" "$GITHUB_WORKSPACE/launcher3-src"

      - name: Verify merged manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find "$GITHUB_WORKSPACE/launcher3-src/build/intermediates/merged_manifest" -path '*/aospWithQuickstepDebug/processAospWithQuickstepDebugMainManifest/AndroidManifest.xml' -print -quit)"
          test -n "$MANIFEST" || { echo "Merged manifest not found"; exit 1; }
          python3 "$GITHUB_WORKSPACE/devdex-src/scripts/verify-plus-manifest.py" "$MANIFEST"

      - name: Package prototype APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE/launcher3-src/build/outputs/apk" -path '*/aospWithQuickstep/debug/*.apk' -type f -print -quit)"
          test -n "$APK" || { echo "Launcher3 prototype APK not found"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/DevDexPlus-Launcher3-base-alpha-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/DevDexPlus-Launcher3-base-alpha-debug.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          echo "Built APK: $APK"

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: DevDexPlus-Launcher3-prototype
          path: dist/*
          if-no-files-found: error
          retention-days: 14
