name: Build DevDex Plus APK

on:
  push:
    branches:
      - 'devdex-plus/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plus:
    name: Integrate and build DevDex Plus
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout DevDex integration branch
        uses: actions/checkout@v4
        with:
          path: devdex-src

      - name: Checkout Lawnchair 16-dev source
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 15ebe415830d8ac29a0b23659c8f6db10759d745
          path: lawnchair-src
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integrate DevDex engine and apply launcher patch
        run: bash "$GITHUB_WORKSPACE/devdex-src/scripts/build-plus-in-ci.sh" "$GITHUB_WORKSPACE/devdex-src" "$GITHUB_WORKSPACE/lawnchair-src"

      - name: Verify freeform default and migration were integrated
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'defaultValue = true' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/preferences2/PreferenceManager2.kt"
          grep -q 'devdex_plus_desktop_mode_migrated' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/preferences2/PreferenceManager2.kt"
          grep -q 'prefs\[key\] = true' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/preferences2/PreferenceManager2.kt"
          grep -q 'setLaunchWindowingMode(WINDOWING_MODE_FREEFORM)' "$GITHUB_WORKSPACE/lawnchair-src/quickstep/src/com/android/launcher3/uioverrides/QuickstepLauncher.java"
          grep -q 'DevDexPlusFreeformSetup.request(context)' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/ui/preferences/destinations/HomeScreenPreferences.kt"
          grep -q 'DevDexPlusFreeformSetup.initialize(this)' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/LawnchairApp.kt"
          test -f "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/src/app/lawnchair/DevDexPlusFreeformSetup.kt"
          grep -q 'devdex_plus_freeform_setup' "$GITHUB_WORKSPACE/lawnchair-src/lawnchair/res/values/strings.xml"

      - name: Build DevDex Plus debug APK
        working-directory: lawnchair-src
        run: ./gradlew assembleLawnWithQuickstepGithubDebug -x licenseeAndroidLawnWithQuickstepGithubDebug -x copyLawnWithQuickstepGithubDebugLicenseeReportToAssets --stacktrace

      - name: Verify merged launcher manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find "$GITHUB_WORKSPACE/lawnchair-src/build/intermediates/merged_manifest" -path '*/lawnWithQuickstepGithubDebug/processLawnWithQuickstepGithubDebugMainManifest/AndroidManifest.xml' -print -quit)"
          test -n "$MANIFEST" || { echo "Merged manifest not found"; exit 1; }
          python3 "$GITHUB_WORKSPACE/devdex-src/scripts/verify-plus-manifest.py" "$MANIFEST"

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APK_CANDIDATES < <(find "$GITHUB_WORKSPACE/lawnchair-src/build/outputs/apk" -type f -name 'DevDexPlus*.apk' -print | sort)
          if [[ "${#APK_CANDIDATES[@]}" -ne 1 ]]; then
            printf 'Expected exactly one DevDex Plus APK, found %s\n' "${#APK_CANDIDATES[@]}"
            printf '%s\n' "${APK_CANDIDATES[@]}"
            exit 1
          fi
          APK="${APK_CANDIDATES[0]}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/DevDexPlus-alpha-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/DevDexPlus-alpha-debug.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          echo "Built: $APK"

      - name: Upload DevDex Plus APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevDexPlus-shizuku-freeform
          path: dist/*
          if-no-files-found: error
          retention-days: 14
