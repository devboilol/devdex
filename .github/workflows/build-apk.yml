name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Candidate version label (for example 3.5.0-rc.1)"
        required: true
        default: "3.5.0-rc.1"
        type: string
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags:
      - "v*-rc.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve build version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v*-rc.* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION_NAME}" ]]; then
            version="${INPUT_VERSION_NAME}"
          else
            version="3.5.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version label '${version}'. Use X.Y.Z or X.Y.Z-rc.N."
            exit 1
          fi

          echo "version_name=${version}" >> "${GITHUB_OUTPUT}"
          echo "DEVDEX_VERSION_NAME=${version}" >> "${GITHUB_ENV}"
          echo "Building DevDex ${version} (versionCode $((3500 + GITHUB_RUN_NUMBER)))."

      # Configure these Actions secrets together for stable install-over-update:
      # DEVDEX_KEYSTORE_BASE64, DEVDEX_KEYSTORE_PASSWORD,
      # DEVDEX_KEY_ALIAS, DEVDEX_KEY_PASSWORD.
      # Never commit the keystore or its password to this repository.
      - name: Prepare stable signing key (optional)
        id: signing
        env:
          DEVDEX_KEYSTORE_BASE64: ${{ secrets.DEVDEX_KEYSTORE_BASE64 }}
          DEVDEX_KEYSTORE_PASSWORD: ${{ secrets.DEVDEX_KEYSTORE_PASSWORD }}
          DEVDEX_KEY_ALIAS: ${{ secrets.DEVDEX_KEY_ALIAS }}
          DEVDEX_KEY_PASSWORD: ${{ secrets.DEVDEX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "configured=false" >> "${GITHUB_OUTPUT}"
          values="${DEVDEX_KEYSTORE_BASE64}${DEVDEX_KEYSTORE_PASSWORD}${DEVDEX_KEY_ALIAS}${DEVDEX_KEY_PASSWORD}"

          if [[ -z "${values}" ]]; then
            echo "::warning::Stable signing is not configured. The debug APK will be available for testing, but no public GitHub Release will be published."
            exit 0
          fi

          if [[ -z "${DEVDEX_KEYSTORE_BASE64}" || -z "${DEVDEX_KEYSTORE_PASSWORD}" || -z "${DEVDEX_KEY_ALIAS}" || -z "${DEVDEX_KEY_PASSWORD}" ]]; then
            echo "::error::Set all four DEVDEX signing secrets or leave all four empty."
            exit 1
          fi

          printf '%s' "${DEVDEX_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/devdex-signing.jks"
          echo "DEVDEX_SIGNING_STORE_FILE=${RUNNER_TEMP}/devdex-signing.jks" >> "${GITHUB_ENV}"
          echo "configured=true" >> "${GITHUB_OUTPUT}"
          echo "Stable signing key prepared."

      - name: Run unit tests and build debug APK
        env:
          DEVDEX_SIGNING_STORE_PASSWORD: ${{ secrets.DEVDEX_KEYSTORE_PASSWORD }}
          DEVDEX_SIGNING_KEY_ALIAS: ${{ secrets.DEVDEX_KEY_ALIAS }}
          DEVDEX_SIGNING_KEY_PASSWORD: ${{ secrets.DEVDEX_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug \
            -PdevdexBuildNumber="${GITHUB_RUN_NUMBER}" \
            -PdevdexVersionName="${DEVDEX_VERSION_NAME}" \
            --stacktrace

      - name: Build signed release APK when stable signing is configured
        if: steps.signing.outputs.configured == 'true'
        env:
          DEVDEX_SIGNING_STORE_PASSWORD: ${{ secrets.DEVDEX_KEYSTORE_PASSWORD }}
          DEVDEX_SIGNING_KEY_ALIAS: ${{ secrets.DEVDEX_KEY_ALIAS }}
          DEVDEX_SIGNING_KEY_PASSWORD: ${{ secrets.DEVDEX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PdevdexBuildNumber="${GITHUB_RUN_NUMBER}" \
            -PdevdexVersionName="${DEVDEX_VERSION_NAME}" \
            --stacktrace

      - name: Package candidate artifacts and checksums
        env:
          STABLE_SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          debug_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${debug_apk}" || { echo "::error::Debug APK not found."; exit 1; }
          cp "${debug_apk}" "dist/DevDex-${DEVDEX_VERSION_NAME}-debug.apk"

          if [[ "${STABLE_SIGNING_CONFIGURED}" == "true" ]]; then
            release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "${release_apk}" || { echo "::error::Signed release APK not found."; exit 1; }
            cp "${release_apk}" "dist/DevDex-${DEVDEX_VERSION_NAME}-release.apk"
            sha256sum dist/*-release.apk > dist/RELEASE-SHA256SUMS.txt
          fi

          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          {
            printf 'versionName=%s\n' "${DEVDEX_VERSION_NAME}"
            printf 'versionCode=%s\n' "$((3500 + GITHUB_RUN_NUMBER))"
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'runId=%s\n' "${GITHUB_RUN_ID}"
            printf 'runNumber=%s\n' "${GITHUB_RUN_NUMBER}"
            printf 'stableSigningConfigured=%s\n' "${STABLE_SIGNING_CONFIGURED}"
          } > dist/BUILD-METADATA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DevDex-${{ steps.version.outputs.version_name }}-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release Candidate
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: DevDex ${{ steps.version.outputs.version_name }} (Release Candidate)
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/DevDex-*-release.apk
            dist/RELEASE-SHA256SUMS.txt
            dist/BUILD-METADATA.txt

      - name: Explain artifact-only RC build
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::warning::The RC APK was built as a workflow artifact only. Configure all four stable signing secrets before publishing a GitHub pre-release."
